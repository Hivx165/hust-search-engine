<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung tâm Chuyển đổi số R&D & Khoa học Cảm quan</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/300.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/500.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/600.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/700.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/800.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        accent: {
                            50: '#fdf4ff',
                            100: '#fae8ff',
                            200: '#f5d0fe',
                            300: '#f0abfc',
                            400: '#e879f9',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                            800: '#86198f',
                            900: '#701a75',
                        },
                        emerald: {
                            50: '#ecfdf5',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'gradient': 'gradient 8s ease infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        gradient: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', sans-serif; }
        html { scroll-behavior: smooth; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #38bdf8, #e879f9, #34d399);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradient 8s ease infinite;
        }
        
        .hero-gradient {
            background: linear-gradient(135deg, #0c4a6e 0%, #1e1b4b 50%, #581c87 100%);
        }
        
        .card-hover {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .chat-bubble-user {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
        }
        .chat-bubble-ai {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
        }
        
        .scroll-reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }
        .scroll-reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        
        .typing-effect {
            overflow: hidden;
            white-space: nowrap;
            animation: typing 3s steps(40, end);
        }
        
        .glow-effect {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5), 0 0 40px rgba(56, 189, 248, 0.3);
        }

        .grid-pattern {
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
        }


        html { overflow-y: scroll; overflow-x: hidden; }
        body { min-height: 100vh; }
        #app { overflow-x: hidden; }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* === PREMIUM ENHANCEMENTS === */
        
        /* Animated gradient border */
        .gradient-border {
            position: relative;
            background: linear-gradient(#0f172a, #0f172a) padding-box,
                        linear-gradient(135deg, #38bdf8, #e879f9, #34d399) border-box;
            border: 1px solid transparent;
        }

        /* Neon glow on hover for cards */
        .card-hover:hover .neon-glow {
            opacity: 1;
        }
        .neon-glow {
            opacity: 0;
            transition: opacity 0.4s ease;
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(circle at 50% 0%, rgba(56,189,248,0.12), transparent 70%);
            pointer-events: none;
        }

        /* Shimmer effect */
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .shimmer-btn {
            position: relative;
            overflow: hidden;
        }
        .shimmer-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            animation: shimmer 2.5s ease infinite;
        }

        /* Tag pill hover */
        .tag-pill {
            transition: all 0.2s ease;
        }
        .tag-pill:hover {
            background: rgba(56,189,248,0.2);
            border-color: rgba(56,189,248,0.4);
            color: #7dd3fc;
        }

        /* Section divider */
        .section-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8, #e879f9);
            border-radius: 2px;
            margin: 0 auto 1.5rem;
        }

        /* Number counter glow */
        .stat-glow {
            text-shadow: 0 0 30px rgba(56,189,248,0.5);
        }

        /* Blog card image overlay */
        .blog-overlay {
            background: linear-gradient(to top, rgba(15,23,42,0.9) 0%, transparent 60%);
            position: absolute;
            inset: 0;
        }

        /* Floating badge */
        @keyframes badge-float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-6px) rotate(2deg); }
        }
        .badge-float {
            animation: badge-float 4s ease-in-out infinite;
        }

        /* Nav active underline */
        nav a.active-nav {
            color: white;
        }
        nav a.active-nav span {
            width: 100% !important;
        }

        /* Pulse ring */
        @keyframes ping-slow {
            0% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        .ping-slow {
            animation: ping-slow 2s ease-out infinite;
        }
        
        /* Mobile menu slide */
        .slide-down-enter-active, .slide-down-leave-active {
            transition: all 0.3s ease;
        }
        .slide-down-enter-from, .slide-down-leave-to {
            opacity: 0;
            transform: translateY(-10px);
        }
    </style>
</head>
<body class="bg-slate-950 text-white">
    <div id="app">
        <!-- App Header -->
        <app-header></app-header>
        
        <!-- Hero Section -->
        <hero-section></hero-section>
        
        <!-- Ecosystem Grid -->
        <ecosystem-grid></ecosystem-grid>
        
        <!-- AI Chatbot -->
        <ai-chatbot></ai-chatbot>
        
        <!-- Blog Updates -->
        <blog-updates></blog-updates>
        
        <!-- App Footer -->
        <app-footer></app-footer>
    </div>

    <script>
        const { createApp, ref, onMounted, computed, watch, nextTick } = Vue;

        // ==================== HEADER COMPONENT ====================
        const AppHeader = {
            template: `
                <header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300" :class="scrolled ? 'bg-slate-950/95 backdrop-blur-md shadow-lg shadow-slate-900/50' : 'bg-transparent'">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex items-center justify-between h-16 lg:h-20">
                            <a href="#" class="flex items-center space-x-3 group">
                                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-accent-500 flex items-center justify-center transform group-hover:rotate-12 transition-transform duration-300">
                                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                                    </svg>
                                </div>
                                <span class="text-lg font-bold gradient-text hidden sm:block">SENSBFT</span>
                            </a>
                            
                            <nav class="hidden md:flex items-center space-x-8">
                                <a v-for="(item, idx) in navItems" :key="idx" :href="item.href"
                                   :class="['text-sm font-medium transition-colors relative group', activeSection === item.section ? 'active-nav text-white' : 'text-slate-300 hover:text-white']">
                                    {{ item.label }}
                                    <span :class="['absolute -bottom-1 left-0 h-0.5 bg-gradient-to-r from-primary-400 to-accent-400 transition-all duration-300', activeSection === item.section ? 'w-full' : 'w-0 group-hover:w-full']"></span>
                                </a>
                            </nav>
                            
                            <div class="flex items-center space-x-4">
                                <button class="hidden sm:inline-flex px-5 py-2.5 rounded-full bg-gradient-to-r from-primary-600 to-accent-600 text-sm font-semibold hover:from-primary-500 hover:to-accent-500 transition-all duration-300 hover:shadow-lg hover:shadow-primary-500/25">
                                    Liên hệ
                                </button>
                                <button @click="mobileMenuOpen = !mobileMenuOpen" class="md:hidden p-2 rounded-lg text-slate-300 hover:text-white hover:bg-white/10 transition-colors">
                                    <svg v-if="!mobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                                    <svg v-else class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Mobile Menu -->
                    <transition name="slide-down">
                        <div v-if="mobileMenuOpen" class="md:hidden bg-slate-900/98 backdrop-blur-lg border-t border-white/5">
                            <div class="px-4 py-6 space-y-4">
                                <a v-for="(item, idx) in navItems" :key="idx" :href="item.href" @click="mobileMenuOpen = false" class="block text-base font-medium text-slate-300 hover:text-white py-2 transition-colors">
                                    {{ item.label }}
                                </a>
                                <button class="w-full mt-4 px-5 py-3 rounded-full bg-gradient-to-r from-primary-600 to-accent-600 text-sm font-semibold">Liên hệ</button>
                            </div>
                        </div>
                    </transition>
                </header>
            `,
            setup() {
                const scrolled = ref(false);
                const mobileMenuOpen = ref(false);
                const activeSection = ref('hero');
                const navItems = [
                    { label: 'Trang chủ', href: '#hero', section: 'hero' },
                    { label: 'Hệ sinh thái', href: '#ecosystem', section: 'ecosystem' },
                    { label: 'AI Chatbot', href: '#chatbot', section: 'chatbot' },
                    { label: 'Nghiên cứu', href: '#blog', section: 'blog' },
                ];
                

                onMounted(() => {
                    window.addEventListener('scroll', () => {
                        scrolled.value = window.scrollY > 50;
                        // Active nav
                        const sections = ['hero','ecosystem','chatbot','blog'];
                        sections.forEach(id => {
                            const el = document.getElementById(id);
                            if(el) {
                                const rect = el.getBoundingClientRect();
                                if(rect.top <= 100 && rect.bottom > 100) {
                                    activeSection.value = id;
                                }
                            }
                        });
                    });
                });
                
                return { scrolled, mobileMenuOpen, navItems, activeSection };
            }
        };

        // ==================== HERO SECTION ====================
        const HeroSection = {
            template: `
                <section id="hero" class="relative min-h-screen flex items-center justify-center overflow-hidden hero-gradient grid-pattern">
                    <!-- Animated Background Particles -->
                    <div class="absolute inset-0 overflow-hidden pointer-events-none">
                        <div v-for="n in 6" :key="n" class="particle bg-primary-500/20" 
                             :style="{
                                 width: particleSizes[n-1] + 'px',
                                 height: particleSizes[n-1] + 'px',
                                 left: particlePositions[n-1].left,
                                 top: particlePositions[n-1].top,
                                 animation: 'float ' + (6 + n) + 's ease-in-out infinite',
                                 animationDelay: n * 0.5 + 's'
                             }">
                        </div>
                    </div>
                    
                    <!-- Gradient Orbs -->
                    <div class="absolute top-1/4 -left-32 w-96 h-96 bg-primary-600/30 rounded-full blur-3xl animate-pulse-slow"></div>
                    <div class="absolute bottom-1/4 -right-32 w-96 h-96 bg-accent-600/20 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 2s"></div>
                    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-emerald-500/10 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 4s"></div>
                    
                    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                        <div class="inline-flex items-center px-4 py-2 rounded-full bg-white/5 border border-white/10 backdrop-blur-sm mb-8">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span>
                            <span class="text-sm text-slate-300">Nền tảng chuyển đổi số Khoa học cảm quan và R&D hàng đầu</span>
                        </div>
                        
                        <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold leading-tight mb-6">
                            <span class="text-white">Trung tâm Chuyển đổi số</span><br>
                            <span class="gradient-text">R&D & Khoa học Cảm quan</span>
                        </h1>
                        
                        <p class="max-w-3xl mx-auto text-lg sm:text-xl text-slate-300 mb-10 leading-relaxed">
                            Nền tảng tích hợp toàn diện giúp tối ưu hóa quy trình phát triển sản phẩm. 
                            Từ ứng dụng <span class="text-primary-300 font-medium">Khoa học Cảm quan và Khoa học người tiêu dùng</span>, 
                            tự động hóa phân tích dữ liệu cảm quan, đến mô hình <span class="text-accent-300 font-medium">Trí tuệ nhân tạo</span> 
                            dự đoán cấu trúc hương vị và thị hiếu người tiêu dùng.
                        </p>
                        
                        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-16">
                            <button @click="scrollToEcosystem" class="shimmer-btn group px-8 py-4 rounded-full bg-gradient-to-r from-primary-600 to-accent-600 text-lg font-semibold hover:from-primary-500 hover:to-accent-500 transition-all duration-300 hover:shadow-xl hover:shadow-primary-500/30 flex items-center space-x-2">
                                <span>Khám phá Hệ sinh thái</span>
                                <svg class="w-5 h-5 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                            </button>
                            <button class="px-8 py-4 rounded-full border border-white/20 text-lg font-semibold hover:bg-white/10 transition-all duration-300 flex items-center space-x-2">
                                <svg class="w-5 h-5 text-primary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                <span>Xem Demo</span>
                            </button>
                        </div>
                        
                        <!-- Stats -->
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 max-w-4xl mx-auto">
                            <div v-for="(stat, idx) in stats" :key="idx" class="glass-card rounded-2xl p-6 text-center">
                                <div class="text-3xl sm:text-4xl font-bold gradient-text stat-glow mb-1">{{ stat.value }}</div>
                                <div class="text-sm text-slate-400">{{ stat.label }}</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Scroll Indicator -->
                    <div class="absolute bottom-8 left-1/2 -translate-x-1/2 animate-bounce">
                        <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/></svg>
                    </div>
                </section>
            `,
            setup() {
                const stats = [
                    { value: '4+', label: 'Hệ thống tích hợp' },
                    { value: '50+', label: 'Phép thử cảm quan' },
                    { value: '99.2%', label: 'Độ chính xác AI' },
                    { value: '24/7', label: 'Hỗ trợ tự động' },
                ];
                
                const particleSizes = [100, 60, 150, 80, 120, 50];
                const particlePositions = [
                    { left: '10%', top: '20%' },
                    { left: '80%', top: '30%' },
                    { left: '50%', top: '70%' },
                    { left: '20%', top: '80%' },
                    { left: '70%', top: '10%' },
                    { left: '90%', top: '60%' },
                ];
                
                const scrollToEcosystem = () => {
                    document.getElementById('ecosystem')?.scrollIntoView({ behavior: 'smooth' });
                };
                
                return { stats, particleSizes, particlePositions, scrollToEcosystem };
            }
        };

        // ==================== ECOSYSTEM GRID ====================
        const EcosystemGrid = {
            template: `
                <section id="ecosystem" class="relative py-24 lg:py-32 bg-slate-950 overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-b from-slate-900/50 via-slate-950 to-slate-950"></div>
                    
                    <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="text-center mb-16 scroll-reveal">
                            <span class="inline-block px-4 py-1.5 rounded-full bg-primary-500/10 border border-primary-500/20 text-primary-400 text-sm font-medium mb-4">HỆ SINH THÁI SỐ</span>
                            <div class="section-divider"></div>
                            <h2 class="text-3xl sm:text-4xl lg:text-5xl font-bold mb-4">
                                <span class="text-white">Nền tảng </span>
                                <span class="gradient-text">Tích hợp Toàn diện</span>
                            </h2>
                            <p class="max-w-2xl mx-auto text-slate-400 text-lg">Bốn trụ cột công nghệ, một hệ sinh thái thống nhất — tối ưu hóa toàn bộ vòng đời R&D thực phẩm.</p>
                        </div>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8">
                            <div v-for="(card, idx) in ecosystemCards" :key="idx" 
                                 class="scroll-reveal card-hover rounded-2xl p-1 bg-gradient-to-br from-slate-700/50 to-slate-800/50 cursor-pointer group"
                                 :style="{ animationDelay: idx * 0.15 + 's' }"
                                 @click="handleCardClick(card.action)">
                                <div class="h-full rounded-xl bg-slate-900/95 p-6 lg:p-8 relative overflow-hidden">
                                    <div class="neon-glow"></div>
                                    <!-- Background gradient on hover -->
                                    <div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-500" :class="card.bgGradient"></div>
                                    
                                    <div class="relative z-10">
                                        <div class="flex items-start justify-between mb-6">
                                            <div class="w-14 h-14 rounded-xl flex items-center justify-center" :class="card.iconBg">
                                                <span v-html="card.iconSvg" :class="card.iconColor"></span>
                                            </div>
                                            <div class="px-3 py-1 rounded-full text-xs font-semibold" :class="card.badgeClass">
                                                {{ card.badge }}
                                            </div>
                                        </div>
                                        
                                        <h3 class="text-xl lg:text-2xl font-bold mb-3 text-white group-hover:text-primary-300 transition-colors">
                                            {{ card.title }}
                                        </h3>
                                        
                                        <p class="text-slate-400 text-sm lg:text-base leading-relaxed mb-6">
                                            {{ card.description }}
                                        </p>
                                        
                                        <div class="flex flex-wrap gap-2 mb-6">
                                            <span v-for="tag in card.tags" :key="tag" class="px-2.5 py-1 rounded-md text-xs font-medium bg-slate-800 text-slate-300 border border-slate-700">
                                                {{ tag }}
                                            </span>
                                        </div>
                                        
                                        <div class="flex items-center space-x-2 text-sm font-semibold transition-colors" :class="card.actionColor">
                                            <span>{{ card.actionText }}</span>
                                            <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            `,
            setup() {
                const ecosystemCards = [
                    {
                        title: 'Sensory Analytics Pro',
