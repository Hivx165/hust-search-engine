s \u0026 Event\",\"seeAll\":\"See All News\"},\"projects\":{\"title\":\"Innovative Solutions\",\"subtitle\":\"Our Projects\",\"vchain\":\"A Platform for Development and Deployment of Decentralized Applications\",\"b4e\":\"Digital certificate generation and verification system using Remote Digital Dignature and Blockchain\",\"bagri\":\"Blockchain-based Agricultural product traceability and management system\",\"bsign\":\"Internal digital signature system using remote digital signature technology\",\"bkoffice\":\"Document management and administration system for universities\",\"ediploma\":\"System for creating and authenticating diplomas, certificates, digital certificates\"},\"course\":{\"title\":\"Short-term courses\",\"da\":\"The course is designed to help students master data analysis using today's most popular tools such as SQL, Power BI, Python and AI.\",\"ai\":\"The course provides a basic knowledge base of artificial intelligence (AI), AI tools and programming for beginners.\",\"bc\":\"The course provides knowledge about AI, Blockchain, Fintech for students and researchers, opening up future career opportunities.\"}}},\"Education\":{\"sections\":{\"banner\":{\"title\":\"Education \u0026 Training\",\"description\":\"The Institute for Technology and Digital Economy (BK Fintech) provides high-quality education and training programs, equipping learners with essential skills for the digital economy era and supporting enterprises in their digital transformation journey.\"},\"courses\":{\"course\":{\"title\":\"Short-term courses\",\"da\":\"The course is designed to help students master data analysis using today's most popular tools such as SQL, Power BI, Python and AI.\",\"ai\":\"The course provides a basic knowledge base of artificial intelligence (AI), AI tools and programming for beginners.\",\"bc\":\"The course provides knowledge about AI, Blockchain, Fintech for students and researchers, opening up future career opportunities.\"},\"publicLectures\":{\"title\":\"Public Lectures\",\"ai\":\"The course provides a basic knowledge base of artificial intelligence (AI), AI tools and programming for beginners.\",\"da\":\"The course is designed to help students master data analysis using today`s most popular tools such as SQL, Power BI, Python and AI.\"}},\"certification\":{\"title\":\"Certification\",\"items\":{\"completion\":{\"title\":\"Certificate of Completion\",\"issuer\":\"Issued by Hanoi University of Science and Technology\"},\"participation\":{\"title\":\"Certificate of Participation\",\"issuer\":\"Issued by BK Fintech \u0026 our partners\"}}},\"seminar\":{\"title\":\"Seminar \u0026 Workshop\",\"upcoming\":\"Upcoming Events\"},\"student\":{\"title\":\"Student Life\",\"description\":\"At the Institute for Digital Technology and Economy – HUST, student life is about more than just lectures. It’s about being part of a vibrant, forward-thinking community where students explore ideas, build skills, and grow personally and professionally.\",\"items\":{\"facility\":{\"title\":\"Facility\",\"desc\":\"Modern, tech-enabled learning spaces designed to support collaboration, innovation and hands-on practice\"},\"activity\":{\"title\":\"Activity\",\"desc\":\"A dynamic calendar of workshops, lecturers and competitions that help students apply knowledge, develop skills and connect with industry experts\"},\"community\":{\"title\":\"Community\",\"desc\":\"A vibrant network of student clubs and interest groups where learners collaborate, explore emerging technologies and grow together\"}}}}},\"Partners\":{\"title\":\"Partners\",\"rikkei\":{\"title\":\"Rikkei\",\"desc\":\"Founded in 2012, Rikkeisoft is a leading, award-winning technology company in Vietnam. Providing customized technology products and solutions to businesses for over 10 years, we have built lasting and meaningful relationships with small and medium-sized businesses around the world.\"},\"mbbank\":{\"title\":\"MB Bank\",\"desc\":\"Military Commercial Joint Stock Bank (MB) is an enterprise of the People's Army of Vietnam under the Ministry of National Defence. Besides banking, MB operates in securities, fund management, and real estate through its subsidiaries. With over 100 branches and 180 transaction offices across 48 provinces, MB also has branches in Laos and Cambodia. In 2022, MB Bank sponsored a conference hall for the BKFintech institute on the first floor of the Digital Hub building.\",\"sponsor\":\"In 2022, MB Bank sponsored a conference hall for the BKFintech institute on the first floor of the Digital Hub building.\"},\"tntech\":{\"title\":\"TNTech\",\"desc\":\"TNTech, a member of ROX Key, specializes in delivering modern technology solutions for diverse sectors, including Finance–Banking, Real Estate, and Services. The company focuses on applying advanced technologies to enhance business operations and productivity. TNTech is partnering with the BKFintech institute in the fields of digital transformation for banks and enterprises.\",\"sponsor\":\"TNTech is partnering with the BKFintech institute in the fields of digital transformation for banks and enterprises.\"},\"oraichainlab\":{\"title\":\"Oraichain Labs\",\"desc\":\"Oraichain Labs is committed to advancing Blockchain x Artificial Intelligence by uniting global experts in blockchain, data science, and engineering. As a core developer for Oraichain Foundation, it builds essential infrastructure, including the Oraichain Mainnet v3.0 with 1-second block time and AI Oracle 2.0. Oraichain Labs partners with BKFintech to establish the BKFintech–Oraichain joint research lab.\",\"sponsor\":\"Oraichain Labs is partnering with the BKFintech Institute to establish a joint research laboratory for Blockchain technology and Artificial Intelligence (BKFintech-Oraichain joint labs), located at the Institute.\"},\"astargroup\":{\"title\":\"A-Star Group\",\"desc\":\"A-Star Group is a Web3 Venture Studio that evolved from a research lab into a product development company. Powered by Vietnam’s top 1% IT talents, the group focuses on building scalable ventures in Web3, AI, Big Data, FinTech, and Tokenized Assets. A-Star is collaborating with the BKFintech to foster innovation, entrepreneurship, and provide expert training and consulting.\",\"sponsor\":\"A-Star Group is collaborating with the BKFintech institute on activities to support innovation and student entrepreneurship, as well as providing experts to participate in training and technology consulting.\"},\"finxdemy\":{\"title\":\"Finxdemy\",\"desc\":\"Finxdemy is a training and consulting organization specializing in technology, digital economy, and digital transformation. With the motto “Learn deeply – Act differently,” we aim to develop training and consulting programs that integrate academic knowledge with practical experience, guided by leading lecturers and seasoned industry experts.\"}},\"ClubPage\":{\"title\":\"BK Fintech Club – Finance \u0026 Technology Club, Hanoi University of Science and Technology\",\"slogan\":\"Slogan: \\\"Never step back\\\"\",\"intro\":{\"question\":\"Are you passionate about finance, interested in technology, or eager to explore the booming global fintech trends?\",\"answer\":\"👉 BK FINTECH CLUB is the perfect place for you!\"},\"sections\":{\"structure\":{\"title\":\"1. Organizational Structure\",\"desc\":\"BK Fintech Club operates under the academic supervision of the Institute of Digital Technology and Economics (BK Fintech) and the organizational management of the Youth Union of Hanoi University of Science and Technology (HUST). The club follows a professional and transparent model, including: \",\"board\":\"👑 Executive Board:\",\"boardDesc\":\"01 President \u0026 02 Vice Presidents.\",\"divisionsTitle\":\"🧩 Specialized Divisions:\",\"divisions\":[\"Specialist Department\",\"External Relations \u0026 Finance – Human Resources Division\",\"Media \u0026 Events Division\"]},\"guidelines\":{\"title\":\"2. Action Guidelines\",\"desc\":\"BK Fintech Club aims to build a creative, dynamic, academically strong community where students can:\",\"items\":[\"Gain early exposure to fundamental knowledge in finance, technology, and fintech.\",\"Participate in research and develop real-world applications, projects, and products.\",\"Enhance academic skills: research, programming, and data analysis.\",\"Join extracurricular activities that strengthen bonding and team spirit.\",\"Develop essential soft skills: communication, teamwork, presentation, time management, etc.\"]},\"activities\":{\"title\":\"3. Activities\",\"items\":[\"🔥 Regular seminars on academic topics, as well as workshops on studying and research.\",\"🏆 Support and guidance for members participating in technology and finance competitions.\"],\"memberDevTitle\":\"🚀 Member Development:\",\"memberDevItems\":[\"Periodic internal training on programming, data analysis, basic and advanced finance.\",\"Participation in research seminars, knowledge-sharing sessions, and career development discussions.\"]},\"closing\":{\"desc1\":\"BK Fintech Club is not only a place to learn but also a space for each member to grow, make an impact, and build a sustainable career journey.\",\"desc2\":\"🌟 BK Fintech Club – Never step back!\"},\"contact\":{\"title\":\"4. Contact\",\"name\":\"FINANCE \u0026 TECHNOLOGY CLUB, HANOI UNIVERSITY OF SCIENCE AND TECHNOLOGY\",\"fanpageLabel\":\"Fanpage\",\"websiteLabel\":\"Website\",\"emailLabel\":\"Email\",\"addressLabel\":\"Contact Address\",\"address\":\"BKFintech office (Room 609 – Ta Quang Buu Library, Hanoi University of Science and Technology)\"}}},\"PublicLectures\":{\"title\":\"Public Lectures\",\"empty\":\"Content is being updated. Please check back later.\"},\"SoiAsia\":{\"title\":\"SOI ASIA Project\",\"description\":\"SOI ASIA is an international cooperation project focused on promoting entrepreneurship and innovation ecosystem development in the Asia-Pacific region. The project includes training programs and startup support for students, resear
