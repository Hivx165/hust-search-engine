  <body>
    <div id="app">
      <div class="app-loading" role="status" aria-label="Đang tải ứng dụng" aria-busy="true">
        <span class="app-spinner" aria-hidden="true"></span>
        <p class="app-loading-text">Đang tải ứng dụng...</p>
      </div>
    </div>
    <script>
      setTimeout(() => {
        const retryKey = 'eoffice-app-refresh-attempted'
        const isLoading = document.querySelector('#app .app-loading') !== null
        try {
          if (!isLoading) {
            sessionStorage.removeItem(retryKey)
            return
          }
          if (sessionStorage.getItem(retryKey)) return
          sessionStorage.setItem(retryKey, '1')
        } catch {
          // Without sessionStorage, skip recovery to avoid a redirect loop.
          return
        }
        window.location.replace('/refresh-app')
      }, 5000)
    </script>
